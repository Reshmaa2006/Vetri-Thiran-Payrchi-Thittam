{% extends "base.html" %}{% block title %}FitBuddy – Generate Plan{% endblock %}{% block content %}<section class="hero"><p>AI FITNESS PLAN GENERATOR</p><h1>Build a 7-day plan around your goal.</h1><span>Enter your basic details to generate a structured workout plan and nutrition/recovery tip.</span></section><section class="card"><form action="/generate-workout" method="post" class="grid"><label>Name<input name="name" required minlength="2"></label><label>User ID<input name="user_id" required pattern="[A-Za-z0-9_-]+" placeholder="RB001"></label><label>Age<input name="age" type="number" min="13" max="100" required></label><label>Weight (kg)<input name="weight" type="number" step="0.1" min="20.1" max="399.9" required></label><label>Fitness goal<select name="goal" required><option value="">Select</option><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>flexibility</option><option>endurance</option></select></label><label>Intensity<select name="intensity" required><option value="">Select</option><option>low</option><option>medium</option><option>high</option></select></label><button type="submit">Generate Plan</button></form></section>{% endblock %}
